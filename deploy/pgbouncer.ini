; /etc/pgbouncer/pgbouncer.ini — drop-in for high-traffic Next.js fronting Postgres.

[databases]
envoraicms_db = host=127.0.0.1 port=5432 dbname=envoraicms_db

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
server_lifetime = 3600
query_timeout = 30
query_wait_timeout = 60

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Admin / stats
admin_users = postgres
stats_users = postgres
