proxy_cache_path /var/cache/nginx/envoraicms levels=1:2 keys_zone=envoraicms:100m
                 max_size=2g inactive=24h use_temp_path=off;

limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;

map $http_cookie $cache_bypass {
  default 0;
  "~*SESSION|auth" 1;
}

upstream envoraicms_upstream {
  server 127.0.0.1:3000;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name envoraicms.com www.envoraicms.com;
  return 301 https://envoraicms.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.envoraicms.com;

  ssl_certificate     /etc/letsencrypt/live/envoraicms.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/envoraicms.com/privkey.pem;
  return 301 https://envoraicms.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name envoraicms.com;

  ssl_certificate     /etc/letsencrypt/live/envoraicms.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/envoraicms.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  root /var/www/envoraicms/public;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/rss+xml image/svg+xml;
  gzip_proxied any;
  gzip_vary on;

  client_max_body_size 10m;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  limit_req zone=global burst=200 nodelay;

  location /Content/ {
    alias /var/www/envoraicms/public/Content/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /Upload/ {
    alias /var/www/envoraicms/public/Upload/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location /_next/static/ {
    alias /var/www/envoraicms/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /_next/image {
    proxy_cache envoraicms;
    proxy_cache_valid 200 7d;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_pass http://envoraicms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  location = /favicon.ico {
    alias /var/www/envoraicms/public/Upload/favicon/favicon.ico;
    access_log off;
    expires 30d;
  }

  location = /robots.txt {
    proxy_pass http://envoraicms_upstream;
    proxy_cache envoraicms;
    proxy_cache_valid 200 1h;
    proxy_set_header Host $host;
  }

  location = /sitemap.xml {
    proxy_pass http://envoraicms_upstream;
    proxy_cache envoraicms;
    proxy_cache_valid 200 1h;
    proxy_set_header Host $host;
  }

  location = /rss.xml {
    proxy_pass http://envoraicms_upstream;
    proxy_cache envoraicms;
    proxy_cache_valid 200 5m;
    proxy_set_header Host $host;
  }

  location /search {
    limit_req zone=search burst=20 nodelay;
    proxy_pass http://envoraicms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location = /api/health {
    access_log off;
    proxy_pass http://envoraicms_upstream;
    proxy_set_header Host $host;
  }

  location / {
    proxy_cache envoraicms;
    proxy_cache_valid 200 60s;
    proxy_cache_valid 404 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $cache_bypass;
    proxy_no_cache $cache_bypass;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_pass http://envoraicms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
